name: CI/CD Pipeline - TimeManager

on:
  push:
    branches: [ "main" ]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/timemanager-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/timemanager-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    name: Deploy to Azure VPS
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 10m
          script: |
            mkdir -p /home/epitech_azure/timemanager
            cd /home/epitech_azure/timemanager

            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/timemanager-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/timemanager-frontend:latest

            docker-compose -f docker-compose.prod.yml down -t 10 || true
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 10
            
            docker image prune -af --filter "until=24h"