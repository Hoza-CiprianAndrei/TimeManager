version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: timemanager_db
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  phoenix:
    image: ${DOCKER_USER}/timemanager-backend:latest
    container_name: timemanager_backend
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 450M
    depends_on:
      - db
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PORT: ${PORT}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    ports:
      - "4000:4000"

  frontend:
    image: ${DOCKER_USER}/timemanager-frontend:latest
    container_name: timemanager_frontend
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    depends_on:
      - phoenix
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - timemanager_default
  
  certbot:
    image: certbot/certbot:latest
    container_name: timemanager_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - timemanager_default

volumes:
  db_data:
  certbot_www:
  certbot_conf: